<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Question Playground — ニホンクエスト</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f3f4f8;
        color: #222;
      }
      .pg {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 16px;
        padding: 16px;
        height: 100vh;
        box-sizing: border-box;
      }
      .pg-side {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: auto;
      }
      .pg-side select,
      .pg-side textarea,
      .pg-side input {
        width: 100%;
        box-sizing: border-box;
        font:
          13px/1.4 ui-monospace,
          monospace;
      }
      .pg-side textarea {
        height: 260px;
      }
      .pg-stage {
        position: relative;
        width: 960px;
        height: 540px;
        max-width: 100%;
        aspect-ratio: 16/9;
        background: #111;
        border-radius: 8px;
        overflow: hidden;
      }
      .pg-result {
        font:
          12px/1.4 ui-monospace,
          monospace;
        background: #fff;
        padding: 8px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      .pg-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button.pg-run {
        padding: 10px;
        font-size: 16px;
      }
      .pg-warn {
        color: #a33;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="playground"></div>
    <script type="module" src="/src/tools/playground.tsx"></script>
  </body>
</html>
