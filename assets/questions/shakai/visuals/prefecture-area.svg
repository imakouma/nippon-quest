<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="都道府県の面積を比べる資料。北海道が一番広いことを示し、二番目の名前ははてな。"><title>都道府県の面積を比べる資料。北海道が一番広いことを示し、二番目の名前ははてな。</title><rect width="480" height="260" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><text x="240" y="40" font-size="28" text-anchor="middle">都道府県の面積の順位</text><text x="70" y="115" font-size="28" text-anchor="middle">1位</text><rect x="125" y="75" width="310" height="60" rx="5" fill="#b9d7ad" stroke="#26394a" stroke-width="3"/><text x="280" y="115" font-size="28" text-anchor="middle">北海道</text><text x="70" y="205" font-size="28" text-anchor="middle">2位</text><rect x="125" y="165" width="310" height="60" rx="5" fill="#d7e6ef" stroke="#26394a" stroke-width="3"/><text x="280" y="205" font-size="32" text-anchor="middle">？</text><text x="350" y="250" font-size="24" text-anchor="middle">順位を示す模式図</text></g></svg>
