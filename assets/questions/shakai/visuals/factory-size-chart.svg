<svg xmlns="http://www.w3.org/2000/svg" width="480" height="213" viewBox="0 0 480 213" role="img" aria-label="元資料の割合。大工場と中小工場を、事業所数、従業者数、出荷額で比べる。"><title>元資料の割合。大工場と中小工場を、事業所数、従業者数、出荷額で比べる。</title><rect width="480" height="213" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><text x="240" y="30" font-size="24" text-anchor="middle">大工場(300人以上) / 中小工場</text><text x="75" y="82" font-size="24" text-anchor="middle">事業所数</text><rect x="150" y="52" width="300" height="25" rx="5" fill="#c2d9e9" stroke="#26394a" stroke-width="3"/><rect x="150" y="52" width="2.4000000000000004" height="25" rx="5" fill="#cf9d6d" stroke="#26394a" stroke-width="3"/><text x="300" y="101" font-size="24" text-anchor="middle">0.8% / 99.2%</text><text x="75" y="132" font-size="24" text-anchor="middle">従業者数</text><rect x="150" y="102" width="300" height="25" rx="5" fill="#c2d9e9" stroke="#26394a" stroke-width="3"/><rect x="150" y="102" width="90" height="25" rx="5" fill="#cf9d6d" stroke="#26394a" stroke-width="3"/><text x="300" y="151" font-size="24" text-anchor="middle">30% / 70%</text><text x="75" y="182" font-size="24" text-anchor="middle">出荷額</text><rect x="150" y="152" width="300" height="25" rx="5" fill="#c2d9e9" stroke="#26394a" stroke-width="3"/><rect x="150" y="152" width="155.7" height="25" rx="5" fill="#cf9d6d" stroke="#26394a" stroke-width="3"/><text x="300" y="201" font-size="24" text-anchor="middle">51.9% / 48.1%</text></g></svg>
