<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="1960年と2009年の国内輸送割合を比べた元資料。鉄道、自動車、船、航空機の順で示す。貨物は1960年15.07、75.82、9.10、0.00%、2009年0.90、92.21、6.88、0.02%。旅客は1960年60.57、38.94、0.49、0.01%、2009年25.39、74.41、0.10、0.09%。丸めにより合計が100%と一致しない場合がある。"><title>1960年と2009年の国内輸送割合を比べた元資料。鉄道、自動車、船、航空機の順で示す。貨物は1960年15.07、75.82、9.10、0.00%、2009年0.90、92.21、6.88、0.02%。旅客は1960年60.57、38.94、0.49、0.01%、2009年25.39、74.41、0.10、0.09%。丸めにより合計が100%と一致しない場合がある。</title><rect width="480" height="320" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><rect x="15" y="8" width="15" height="20" rx="5" fill="#a6c7df" stroke="#26394a" stroke-width="3"/><text x="72" y="28" font-size="24" text-anchor="middle">鉄道</text><rect x="135" y="8" width="15" height="20" rx="5" fill="#e0b88d" stroke="#26394a" stroke-width="3"/><text x="192" y="28" font-size="24" text-anchor="middle">自動車</text><rect x="255" y="8" width="15" height="20" rx="5" fill="#bad3a1" stroke="#26394a" stroke-width="3"/><text x="312" y="28" font-size="24" text-anchor="middle">船</text><rect x="375" y="8" width="15" height="20" rx="5" fill="#d2b8da" stroke="#26394a" stroke-width="3"/><text x="432" y="28" font-size="24" text-anchor="middle">航空機</text><text x="75" y="75" font-size="24" text-anchor="middle">貨物</text><text x="75" y="102" font-size="24" text-anchor="middle">1960年</text><rect x="145" y="60" width="45.21" height="38" rx="5" fill="#a6c7df" stroke="#26394a" stroke-width="3"/><rect x="190.21" y="60" width="227.45999999999998" height="38" rx="5" fill="#e0b88d" stroke="#26394a" stroke-width="3"/><text x="303.94" y="88" font-size="24" text-anchor="middle">75.82</text><rect x="417.66999999999996" y="60" width="27.299999999999997" height="38" rx="5" fill="#bad3a1" stroke="#26394a" stroke-width="3"/><text x="75" y="135" font-size="24" text-anchor="middle">貨物</text><text x="75" y="162" font-size="24" text-anchor="middle">2009年</text><rect x="145" y="120" width="2.7" height="38" rx