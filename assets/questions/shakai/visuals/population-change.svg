<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="人口割合の架空の例。昔に比べて子どもの帯が短く、お年寄りの帯が長くなっている。"><title>人口割合の架空の例。昔に比べて子どもの帯が短く、お年寄りの帯が長くなっている。</title><rect width="480" height="260" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><text x="240" y="30" font-size="25" text-anchor="middle">人口の割合（例）</text><text x="45" y="100" font-size="25" text-anchor="middle">昔</text><text x="45" y="165" font-size="25" text-anchor="middle">今</text><rect x="80" y="65" width="100" height="50" rx="5" fill="#c3dfa1" stroke="#26394a" stroke-width="3"/><rect x="180" y="65" width="210" height="50" rx="5" fill="#cbdce8" stroke="#26394a" stroke-width="3"/><rect x="390" y="65" width="50" height="50" rx="5" fill="#e7ba8c" stroke="#26394a" stroke-width="3"/><rect x="80" y="130" width="50" height="50" rx="5" fill="#c3dfa1" stroke="#26394a" stroke-width="3"/><rect x="130" y="130" width="190" height="50" rx="5" fill="#cbdce8" stroke="#26394a" stroke-width="3"/><rect x="320" y="130" width="120" height="50" rx="5" fill="#e7ba8c" stroke="#26394a" stroke-width="3"/><text x="80" y="235" font-size="25" text-anchor="middle">子ども</text><text x="240" y="235" font-size="25" text-anchor="middle">そのほか</text><text x="395" y="235" font-size="25" text-anchor="middle">お年寄り</text><rect x="25" y="197" width="110" height="10" rx="5" fill="#c3dfa1" stroke="#26394a" stroke-width="3"/><rect x="185" y="197" width="110" height="10" rx="5" fill="#cbdce8" stroke="#26394a" stroke-width="3"/><rect x="340" y="197" width="110" height="10" rx="5" fill="#e7ba8c" stroke="#26394a" stroke-width="3"/></g></svg>
