<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="福岡市の区名を選ぶ図。四つの候補は、西、中央、東、博多。位置や境界を表す地図ではない。"><title>福岡市の区名を選ぶ図。四つの候補は、西、中央、東、博多。位置や境界を表す地図ではない。</title><rect width="480" height="260" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><text x="240" y="30" font-size="28" text-anchor="middle">区の名前を選ぼう</text><rect x="70" y="60" width="140" height="60" rx="5" fill="#edf4f8" stroke="#26394a" stroke-width="3"/><text x="140" y="102" font-size="32" text-anchor="middle">西</text><rect x="270" y="60" width="140" height="60" rx="5" fill="#edf4f8" stroke="#26394a" stroke-width="3"/><text x="340" y="102" font-size="32" text-anchor="middle">中央</text><rect x="70" y="170" width="140" height="60" rx="5" fill="#edf4f8" stroke="#26394a" stroke-width="3"/><text x="140" y="212" font-size="32" text-anchor="middle">東</text><rect x="270" y="170" width="140" height="60" rx="5" fill="#edf4f8" stroke="#26394a" stroke-width="3"/><text x="340" y="212" font-size="32" text-anchor="middle">博多</text></g></svg>
