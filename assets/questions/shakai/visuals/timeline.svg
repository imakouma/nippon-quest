<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="町のできごとを、古い年から新しい年へ並べた架空の資料。"><title>町のできごとを、古い年から新しい年へ並べた架空の資料。</title><rect width="480" height="260" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><text x="240" y="35" font-size="25" text-anchor="middle">ある町の記録（例）</text><g transform="translate(55 125) scale(1 1)"><path d="M0 0h370m-10 -7l10 7-10 7" fill="none" stroke="#386d91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="90" cy="125" r="8" fill="#386d91" stroke="#26394a" stroke-width="3"/><text x="90" y="92" font-size="25" text-anchor="middle">1980年</text><text x="90" y="185" font-size="24" text-anchor="middle">駅ができる</text><circle cx="240" cy="125" r="8" fill="#386d91" stroke="#26394a" stroke-width="3"/><text x="240" y="92" font-size="25" text-anchor="middle">2000年</text><text x="240" y="185" font-size="24" text-anchor="middle">公園ができる</text><circle cx="390" cy="125" r="8" fill="#386d91" stroke="#26394a" stroke-width="3"/><text x="390" y="92" font-size="25" text-anchor="middle">2020年</text><text x="390" y="185" font-size="24" text-anchor="middle">橋ができる</text></g></svg>
