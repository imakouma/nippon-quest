<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="4人から2人を選ぶ。役割は班長、副班長。選び方の結果は描いていない。"><title>4人から2人を選ぶ。役割は班長、副班長。選び方の結果は描いていない。</title><defs><symbol id="person" viewBox="0 0 64 64"><circle cx="32" cy="13" r="10" fill="#ffd7b2" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 28L10 44M45 28L54 44M24 43L20 61M40 43L44 61" fill="none" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 25H45V45H19Z" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M28 15Q32 19 36 15" fill="none" stroke="#273449" stroke-width="2"/></symbol></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><use href="#person" x="50" y="25" width="75" height="75"/><text x="50" y="125" font-size="22">まさし</text><use href="#person" x="165" y="25" width="75" height="75"/><text x="165" y="125" font-size="22">さおり</text><use href="#person" x="280" y="25" width="75" height="75"/><text x="280" y="125" font-size="22">みく</text><use href="#person" x="395" y="25" width="75" height="75"/><text x="395" y="125" font-size="22">ゆうた</text><rect x="160" y="160" width="145" height="75" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="180" y="208" font-size="25">班長</text><rect x="330" y="160" width="145" height="75" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="350" y="208" font-size="25">副班長</text></g></svg>
