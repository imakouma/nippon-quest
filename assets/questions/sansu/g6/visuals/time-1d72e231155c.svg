<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="1分を4等分し、1つ分が青。1分は60秒。"><title>1分を4等分し、1つ分が青。1分は60秒。</title><defs></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><text x="135" y="25" font-size="22">1分 ＝ 60秒</text><text x="35" y="80" font-size="25">1/4</text><g data-denominator="4" data-whole-width="530"><rect x="145" y="50" width="132.5" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="277.5" y="50" width="132.5" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="410" y="50" width="132.5" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="542.5" y="50" width="132.5" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></g><text x="200" y="160" font-size="28">青い部分 1/4 分</text><text x="230" y="220" font-size="28">何秒に なるかな？</text></g></svg>
