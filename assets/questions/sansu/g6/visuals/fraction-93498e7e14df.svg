<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="計算に使う量4/5、1/2を示す。枠1つの大きさは共通。4/5×1/2の答えは示していない。"><title>計算に使う量4/5、1/2を示す。枠1つの大きさは共通。4/5×1/2の答えは示していない。</title><defs></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><text x="135" y="25" font-size="22">計算する量を 同じ大きさの1で 表した図</text><text x="35" y="80" font-size="25">4/5</text><g data-denominator="5" data-whole-width="530"><rect x="145" y="50" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="251" y="50" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="357" y="50" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="463" y="50" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="569" y="50" width="106" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></g><text x="35" y="145" font-size="25">1/2</text><g data-denominator="2" data-whole-width="530"><rect x="145" y="115" width="265" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="410" y="115" width="265" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></g></g></svg>
