<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="出発点から到着点まで30kmの道のり。速さを時速x km、かかる時間をy時間とした図。"><title>出発点から到着点まで30kmの道のり。速さを時速x km、かかる時間をy時間とした図。</title><defs><symbol id="car" viewBox="0 0 64 64"><path d="M4 29H15L24 13H44L53 29H60V50H4Z" fill="#e5484d" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 17H41L48 29H18Z" fill="#c8f4ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="51" r="8" fill="#273449"/><circle cx="49" cy="51" r="8" fill="#273449"/></symbol></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><text x="300" y="40" font-size="26">道のり 30km</text><path d="M130 160h540m-12 -9l12 9-12 9" fill="none" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><use href="#car" x="155" y="55" width="95" height="95"/><text x="280" y="100" font-size="26">時速 x km</text><text x="280" y="140" font-size="22">時間 y 時間</text><text x="100" y="210" font-size="24">出発</text><text x="640" y="210" font-size="24">到着</text></g></svg>
