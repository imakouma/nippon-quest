<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="40と10を同じ尺度の帯で比較する図。比の値や等しい比の答えは示していない。"><title>40と10を同じ尺度の帯で比較する図。比の値や等しい比の答えは示していない。</title><defs></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><text x="180" y="35" font-size="24">同じ尺度で2つの量を比べよう</text><text x="55" y="100" font-size="28">40</text><rect data-ratio-value="40" x="175" y="65" width="500" height="55" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="55" y="190" font-size="28">10</text><rect data-ratio-value="10" x="175" y="155" width="125" height="55" fill="#ffe0a6" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></g></svg>
