<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="人数（人）の1から6に対応する1人分（L）を表に整理。下段は24、①、8、6、②、③。①〜③は答える空欄。"><title>人数（人）の1から6に対応する1人分（L）を表に整理。下段は24、①、8、6、②、③。①〜③は答える空欄。</title><defs><symbol id="juice" viewBox="0 0 64 64"><path d="M15 8h34l-4 50H20z" fill="#ffb64c" stroke="#273449" stroke-width="2"/><path d="M33 40V3h20" fill="none" stroke="#273449" stroke-width="3"/></symbol></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><use href="#juice" x="100" y="20" width="85" height="85"/><text x="280" y="85" font-size="28">24Lを 等しく 分ける</text><rect x="15" y="145" width="170" height="45" rx="4" fill="#eaf3f7" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="23" y="174" font-size="18">人数（人）</text><rect x="185" y="145" width="100" height="45" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="200" y="175" font-size="24">1</text><rect x="285" y="145" width="100" height="45" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="175" font-size="24">2</text><rect x="385" y="145" width="100" height="45" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="400" y="175" font-size="24">3</text><rect x="485" y="145" width="100" height="45" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="500" y="175" font-size="24">4</text><rect x="585" y="145" width="100" height="45" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="600" y="175" font-size="24">5</text><rect x="685" y="145" width="100" height="45" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="700" y="175" font-size="24">6</text><rect x="15" y="190" width="170" height="45" rx="4" fill="#eaf3f7" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="23" y="21