<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="計算に使う量2/3、4/5を示す。枠1つの大きさは共通。2/3×4/5の答えは示していない。"><title>計算に使う量2/3、4/5を示す。枠1つの大きさは共通。2/3×4/5の答えは示していない。</title><defs></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><text x="135" y="25" font-size="22">計算する量を 同じ大きさの1で 表した図</text><text x="35" y="80" font-size="25">2/3</text><g data-denominator="3" data-whole-width="530"><rect x="145" y="50" width="176.66666666666666" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="321.66666666666663" y="50" width="176.66666666666666" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="498.3333333333333" y="50" width="176.66666666666666" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></g><text x="35" y="145" font-size="25">4/5</text><g data-denominator="5" data-whole-width="530"><rect x="145" y="115" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="251" y="115" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="357" y="115" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="463" y="115" width="106" height="38" rx="4" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><rect x="569" y="115" width="106" height="38" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></g></g></svg>
