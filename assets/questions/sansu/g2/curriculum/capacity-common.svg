<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260"><title>違うコップで水を測った結果</title><rect width="640" height="260" fill="#fffdf5"/><g font-family="sans-serif" font-size="24" fill="#24364b" stroke-width="3"><text x="55" y="50">あを はかったコップ</text><text x="365" y="50">いを はかったコップ</text><rect x="100" y="80" width="80" height="100" fill="#b3dcee" stroke="#29455b"/><rect x="430" y="120" width="45" height="60" fill="#b3dcee" stroke="#29455b"/><text x="50" y="225">大きいコップ 3はい</text><text x="345" y="225">小さいコップ 4はい</text></g></svg>
