<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title"><title id="title">あの満杯の水を空のいへ移すと、いが満杯になり、あにも水が残る</title><rect width="640" height="260" rx="12" fill="#fffdf7"/><g font-family="sans-serif"><text x="320" y="35" font-size="26" text-anchor="middle" fill="#24354b">うつした あと</text><rect x="115" y="60" width="120" height="155" fill="#fff" stroke="#24354b" stroke-width="3"/><rect x="115" y="165" width="120" height="50" fill="#69b9df" stroke="#24354b" stroke-width="3"/><rect x="415" y="95" width="100" height="120" fill="#69b9df" stroke="#24354b" stroke-width="3"/><text x="175" y="247" font-size="26" text-anchor="middle" fill="#24354b">あ</text><text x="465" y="247" font-size="26" text-anchor="middle" fill="#24354b">い</text><text x="320" y="135" font-size="45" text-anchor="middle" fill="#24354b">→</text><text x="175" y="145" font-size="23" text-anchor="middle" fill="#24354b">のこる</text><text x="465" y="80" font-size="23" text-anchor="middle" fill="#24354b">いっぱい</text></g></svg>
