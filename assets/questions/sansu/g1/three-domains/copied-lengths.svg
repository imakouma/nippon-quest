<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title"><title id="title">机の長さを写したテープを並べる。いのテープが長い</title><rect width="640" height="260" rx="12" fill="#fffdf7"/><g font-family="sans-serif"><text x="320" y="35" font-size="25" text-anchor="middle" fill="#24354b">つくえの ながさを うつした テープ</text><text x="95" y="105" font-size="23" text-anchor="middle" fill="#24354b">あの つくえ</text><rect x="190" y="70" width="260" height="48" fill="#69b9df" stroke="#24354b" stroke-width="3"/><text x="95" y="200" font-size="23" text-anchor="middle" fill="#24354b">いの つくえ</text><rect x="190" y="165" width="360" height="48" fill="#ffce6c" stroke="#24354b" stroke-width="3"/><path d="M190 55 L190 225" fill="none" stroke="#24354b" stroke-width="4"/></g></svg>
