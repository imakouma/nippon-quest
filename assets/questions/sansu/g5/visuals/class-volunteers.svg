<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="25人を1人ずつの絵で示す。参加する15人には青い背景と参加の見出し、残り10人には白い背景と不参加の見出し。"><title>25人を1人ずつの絵で示す。参加する15人には青い背景と参加の見出し、残り10人には白い背景と不参加の見出し。</title><defs><symbol id="person" viewBox="0 0 64 64"><circle cx="32" cy="13" r="10" fill="#ffd7b2" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 28L10 44M45 28L54 44M24 43L20 61M40 43L44 61" fill="none" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 25H45V45H19Z" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M28 15Q32 19 36 15" fill="none" stroke="#273449" stroke-width="2"/></symbol></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><rect x="30" y="45" width="430" height="195" rx="4" fill="#c8f4ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="100" y="32" font-size="25">参加する 15人</text><g data-participates="yes"><g data-count="15"><use href="#person" x="85" y="60" width="50" height="50"/><use href="#person" x="140" y="60" width="50" height="50"/><use href="#person" x="195" y="60" width="50" height="50"/><use href="#person" x="250" y="60" width="50" height="50"/><use href="#person" x="305" y="60" width="50" height="50"/><use href="#person" x="85" y="115" width="50" height="50"/><use href="#person" x="140" y="115" width="50" height="50"/><use href="#person" x="195" y="115" width="50" height="50"/><use href="#person" x="250" y="115" width="50" height="50"/><use href="#person" x="305" y="115" width="50" height="50"/><use href="#person" x="85" y="170" width="50" height="50"/><use href="#person" x="140" y="170" width="50" height="50"/><use href="#person" x="195" y="170" width="50" height="50"/><use href="#person" x="250" y="170" width="50" height="50"/><use href="#person" x="305" y="170" width="50" height="50"/></g></g><rect x="485" y="45" width="285" height="195" rx="4" fill="#fff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><text x="540" y="32" font-size="25">不参加 10人</text><g data-participates="no"><g data-count="10"><use href="#person" x="495" y="85" width="50" height="50"/><use href="#person" x="550" y="85" width="50" height="50"/><use href="#person" x="605" y="85" width="50" height="50"/><use href="#person" x="660" y="85" width="50" height="50"/><use href="#person" x="715" y="85" width="50" height="50"/><use href="#person" x="495" y="140" width="50" height="50"/><use href="#person" x="550" y="140" width="50" height="50"/><use href="#person" x="605" y="140" width="50" height="50"/><use href="#person" x="660" y="140" width="50" height="50"/><use href="#person" x="715" y="140" width="50" height="50"/></g></g></g></svg>
