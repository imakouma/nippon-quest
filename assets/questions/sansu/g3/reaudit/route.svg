<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img"><title>家から公園までの道のりは300mと400m。まっすぐの距離は500m。</title><rect width="600" height="300" rx="16" fill="#f3f8ff"/><g font-family="sans-serif" fill="#18334c"><path d="M100 225 L100 65 L480 65" fill="none" stroke="#23679b" stroke-width="8"/><path d="M100 225 L480 65" stroke="#a54022" stroke-width="4" stroke-dasharray="9 6"/><text x="55" y="150" font-size="22" text-anchor="middle">300m</text><text x="290" y="45" font-size="22" text-anchor="middle">400m</text><text x="325" y="185" font-size="22" text-anchor="middle">500m</text><text x="90" y="270" font-size="22" text-anchor="middle">いえ</text><text x="500" y="50" font-size="22" text-anchor="middle">こうえん</text><text x="390" y="280" font-size="16" text-anchor="middle">ずの ながさは めやす</text></g></svg>
