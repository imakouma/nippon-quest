<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"><title>箱と粘土を合わせて650g、空の箱は120g</title><rect width="640" height="300" rx="18" fill="#f3f8ff"/><g font-family="sans-serif" fill="#18334c"><text x="320" y="45" font-size="24" text-anchor="middle">はこに はいった ねんど</text><rect x="220" y="70" width="200" height="80" fill="#d6edff" stroke="#2469a3"/><text x="320" y="120" font-size="24" text-anchor="middle">ぜんたい 650g</text><text x="320" y="205" font-size="24" text-anchor="middle">からの はこ 120g</text></g></svg>
