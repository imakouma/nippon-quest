<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title"><title id="title">はかりの目もりの一部。100gから200gを5等分し、はりは100gから3目もり進んだ位置</title><rect width="600" height="240" rx="12" fill="#fffaf0"/><text x="300" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#253646">はかりの めもり（いちぶ）</text><path d="M100 120H500" stroke="#253646" stroke-width="3"/><path d="M100 100V140" stroke="#253646" stroke-width="3"/><path d="M180 100V140" stroke="#253646" stroke-width="3"/><path d="M260 100V140" stroke="#253646" stroke-width="3"/><path d="M340 100V140" stroke="#253646" stroke-width="3"/><path d="M420 100V140" stroke="#253646" stroke-width="3"/><path d="M500 100V140" stroke="#253646" stroke-width="3"/><text x="100" y="175" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#253646">100g</text><text x="500" y="175" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#253646">200g</text><path d="M340 67V98M328 85L340 101L352 85" fill="none" stroke="#b73328" stroke-width="6" stroke-linejoin="round"/><text x="300" y="218" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#253646">おなじ ながさの 5つの あいだ</text></svg>
