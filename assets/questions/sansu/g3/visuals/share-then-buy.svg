<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="800円を2人で同じ金がくずつ分ける。たかしくんが150円のアイスを買い、のこりを求める。"><title>800円を2人で同じ金がくずつ分ける。たかしくんが150円のアイスを買い、のこりを求める。</title><defs><symbol id="person" viewBox="0 0 64 64"><circle cx="32" cy="13" r="10" fill="#ffd7b2" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 28L10 44M45 28L54 44M24 43L20 61M40 43L44 61" fill="none" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 25H45V45H19Z" fill="#80c6ff" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M28 15Q32 19 36 15" fill="none" stroke="#273449" stroke-width="2"/></symbol><symbol id="ice" viewBox="0 0 64 64"><path d="M17 28L32 61L47 28Z" fill="#f2a93b" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><path d="M11 29C6 12 22 3 32 9C45 -2 61 17 52 29Z" fill="#ff8fb1" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/></symbol></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><g fill="#172033" font-family="sans-serif"><text x="25" y="35" font-size="24">800えんを 2にんで わける</text><rect x="25" y="55" width="140" height="145" rx="4" fill="#eaf3f7" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><use href="#person" x="65" y="65" width="55" height="55"/><text x="48" y="170" font-size="26">？えん</text><rect x="175" y="55" width="140" height="145" rx="4" fill="#eaf3f7" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><use href="#person" x="215" y="65" width="55" height="55"/><text x="198" y="170" font-size="26">？えん</text><path d="M335 130h130m-12 -9l12 9-12 9" fill="none" stroke="#273449" stroke-width="2.5" stroke-linejoin="round"/><use href="#ice" x="365" y="35" width="60" height="60"/><text x="350" y="220" font-size="23">150えん</text><text x="500" y="65" font-size="23">たかしくんの のこり</text><text x="580" y="150" font-size="32">？えん</text></g></svg>
