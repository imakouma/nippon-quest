<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="金属の棒を温めたり冷やしたりして長さの変化を調べる。棒のあとの長さは示さない。"><title>金属の棒を温めたり冷やしたりして長さの変化を調べる。棒のあとの長さは示さない。</title><rect width="480" height="260" rx="12" fill="#fff"/><g fill="#26394a" font-family="sans-serif"><rect x="65" y="85" width="350" height="35" rx="5" fill="#c6d2da" stroke="#26394a" stroke-width="3"/><g transform="translate(150 180) scale(1.7)"><path d="M-12 14Q-23 0-6-14Q-9-2 3-20Q26 6 12 14Z" fill="#ed8b51" stroke="#26394a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="240" y="45" font-size="25" text-anchor="middle">金属の 棒</text><text x="240" y="240" font-size="25" text-anchor="middle">長さを くらべる</text></g></svg>
